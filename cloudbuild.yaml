steps:
  # 1. Build the container image using the Dockerfile in the root directory
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/savings-manager:$COMMIT_SHA', '.']

  # 2. Push the container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/savings-manager:$COMMIT_SHA']

  # 3. Deploy the container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'savings-manager'
      - '--image'
      - 'gcr.io/$PROJECT_ID/savings-manager:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast2' # Ubah region ini jika perlu (misal: us-central1)
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/savings-manager:$COMMIT_SHA'

# PENTING: Mengatasi error log Cloud Build pada Service Account baru
options:
  logging: CLOUD_LOGGING_ONLY
