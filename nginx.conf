server {
    # Port 8080 sesuai dengan yang diexpose di Dockerfile (dan default Cloud Run)
    listen 8080;
    
    # Direktori root tempat file statis React disimpan
    root /usr/share/nginx/html;
    index index.html;

    # Konfigurasi gzip untuk performa yang lebih baik
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Aturan penting untuk Single Page Application (SPA) React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache untuk asset statis (CSS, JS, Images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }
}
